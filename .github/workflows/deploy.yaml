name: Deploy Release
on:
  push:
    branches:
      - 'main'
      - 'mc/**'
    paths-ignore:
      - 'README.md'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'

jobs:
  deploy:
    name: Deploy Release
    runs-on: namespace-profile-linux-default
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 25
          cache: "" # namespace handles this
      - name: Set up cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: gradle
      - name: Setup gradle build cache
        run: |
          nsc cache gradle setup --init-gradle /tmp/init.gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true # namespace handles this
      - name: Check definitions
        run: ./gradlew --init-script=/tmp/init.gradle checkUnpickDefinitions --stacktrace --console=colored
      - name: "Get version"
        run: |
          UNPICK_DEF_VERSION=$(./gradlew --init-script=/tmp/init.gradle printVersion --console=plain --quiet)
          echo "UNPICK_DEF_VERSION=$UNPICK_DEF_VERSION" >> $GITHUB_ENV
      - uses: neoforged/action-github-status@v1
        name: Set build pending status
        if: always()
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: 'Publishing'
          state: 'pending'
          description: "Version: ${{ env.UNPICK_DEF_VERSION }}"
          target_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Deploy release version
        run: |
          ./gradlew --init-script=/tmp/init.gradle publishExportZipPublicationToPaperRepository --stacktrace --console=colored
          if [ $? -eq 0 ]; then
            echo "GRADLE_SUCCESS=success" >> $GITHUB_ENV
          else
            echo "GRADLE_SUCCESS=failure" >> $GITHUB_ENV
          fi
        env:
          ORG_GRADLE_PROJECT_paperUsername: ${{ secrets.ARTIFACTORY_USERNAME }}
          ORG_GRADLE_PROJECT_paperPassword: ${{ secrets.ARTIFACTORY_PASSWORD }}
      - uses: neoforged/action-github-status@v1
        name: Set build completion status
        if: always()
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: 'Publishing'
          state: ${{ env.GRADLE_SUCCESS || 'failure' }}
          description: "Version: ${{ env.UNPICK_DEF_VERSION }}"
          target_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
